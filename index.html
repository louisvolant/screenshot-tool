<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphic Studio - Visual Mockup & Marketing Asset Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Bricolage+Grotesque:wght@600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <!-- Top Application Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">✦</div>
      <span>Graphic Studio</span>
    </div>

    <!-- 7 Visual Tools Navigation -->
    <nav class="tool-nav" id="tool-nav">
      <button class="tool-btn active" data-tool="screenshot">Screenshot</button>
      <button class="tool-btn" data-tool="code">Code</button>
      <button class="tool-btn" data-tool="social">Social</button>
      <button class="tool-btn" data-tool="testimonial">Review</button>
      <button class="tool-btn" data-tool="chat">Chat</button>
      <button class="tool-btn" data-tool="notification">Notification</button>
      <button class="tool-btn" data-tool="announce">Announce</button>
    </nav>

    <!-- Top Action Controls -->
    <div class="top-actions">
      <button class="btn-icon" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="btn-icon" id="btn-redo" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button class="btn-icon" id="btn-reset" title="Reset All Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="btn-icon" id="btn-theme" title="Toggle Light/Dark Theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn-secondary" id="btn-copy">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        <span>Copy</span>
      </button>
      <button class="btn-primary" id="btn-download">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span>Download</span>
      </button>
      <button class="btn-secondary" id="btn-batch-export" title="Batch Export Social Pack (ZIP)">
        <span>Batch ZIP</span>
      </button>
    </div>
  </header>

  <!-- Main Studio Workspace -->
  <main class="workspace">
    <!-- Center Live Canvas Stage -->
    <section class="stage">
      <div class="canvas-container">
        <canvas id="preview-canvas"></canvas>
      </div>
    </section>

    <!-- Right Settings Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Dynamic Tool Panel (populated by active tool) -->
      <section class="panel" id="panel-tool">
        <div class="panel-head">
          <span id="panel-tool-title">Tool Settings</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="panel-body" id="panel-tool-body">
          <!-- Injected dynamically -->
        </div>
      </section>

      <!-- Background Panel -->
      <section class="panel" id="panel-background">
        <div class="panel-head">
          <span>Background</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="panel-body">
          <div class="field">
            <label class="field-label">Type</label>
            <div class="segmented" id="bg-type-seg">
              <button class="seg-btn active" data-val="gradient">Gradient</button>
              <button class="seg-btn" data-val="mesh">Mesh</button>
              <button class="seg-btn" data-val="solid">Solid</button>
              <button class="seg-btn" data-val="split">Split</button>
              <button class="seg-btn" data-val="wallpaper">Wallpaper</button>
            </div>
          </div>
          <div class="field" id="bg-angle-field">
            <div class="field-label">
              <span>Angle</span>
              <span class="field-value" id="bg-angle-val">135°</span>
            </div>
            <input type="range" id="bg-angle" min="0" max="360" value="135" />
          </div>
          <div class="field">
            <div class="field-label">
              <span>Noise (Grain)</span>
              <span class="field-value" id="bg-noise-val">0%</span>
            </div>
            <input type="range" id="bg-noise" min="0" max="100" value="0" />
          </div>
          <div class="field">
            <label class="field-label">Pattern</label>
            <select id="bg-pattern">
              <option value="none">None</option>
              <option value="dots">Dots</option>
              <option value="grid">Grid</option>
              <option value="stripes">Stripes</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Layout & Dimensions Panel -->
      <section class="panel" id="panel-layout">
        <div class="panel-head">
          <span>Layout & Framing</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="panel-body">
          <div class="field">
            <label class="field-label">Aspect Ratio</label>
            <select id="layout-aspect">
              <option value="auto">Auto (Snug Content)</option>
              <option value="16:9">16:9 - Landscape (1920×1080)</option>
              <option value="4:3">4:3 - Presentation (1600×1200)</option>
              <option value="1:1">1:1 - Square Post (1200×1200)</option>
              <option value="4:5">4:5 - Mobile Feed (1080×1350)</option>
              <option value="9:16">9:16 - Story & Reels (1080×1920)</option>
              <option value="1200:630">Open Graph Link (1200×630)</option>
              <option value="1500:500">Banner Header (1500×500)</option>
            </select>
          </div>
          <div class="field">
            <div class="field-label">
              <span>Padding</span>
              <span class="field-value" id="layout-padding-val">80px</span>
            </div>
            <input type="range" id="layout-padding" min="0" max="240" value="80" />
          </div>
          <div class="field">
            <div class="field-label">
              <span>Corner Radius</span>
              <span class="field-value" id="layout-radius-val">16px</span>
            </div>
            <input type="range" id="layout-radius" min="0" max="60" value="16" />
          </div>
          <div class="field">
            <div class="field-label">
              <span>Drop Shadow</span>
              <span class="field-value" id="layout-shadow-val">45</span>
            </div>
            <input type="range" id="layout-shadow" min="0" max="100" value="45" />
          </div>
          <div class="field">
            <label class="field-label">Shadow Style</label>
            <div class="segmented" id="shadow-style-seg">
              <button class="seg-btn active" data-val="soft">Soft Layered</button>
              <button class="seg-btn" data-val="hard">Hard Retro</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 3D Perspective Panel -->
      <section class="panel" id="panel-effect">
        <div class="panel-head">
          <span>3D Perspective</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="panel-body">
          <div class="field">
            <label class="field-label">Quick 3D Presets</label>
            <div class="icon-grid" id="tilt-presets">
              <button class="grid-btn active" data-tilt="flat">Flat</button>
              <button class="grid-btn" data-tilt="left">Left</button>
              <button class="grid-btn" data-tilt="right">Right</button>
              <button class="grid-btn" data-tilt="hero">Hero</button>
            </div>
          </div>
          <div class="field">
            <div class="field-label">
              <span>Rotate X (Tilt)</span>
              <span class="field-value" id="effect-rotx-val">0°</span>
            </div>
            <input type="range" id="effect-rotx" min="-60" max="60" value="0" />
          </div>
          <div class="field">
            <div class="field-label">
              <span>Rotate Y (Turn)</span>
              <span class="field-value" id="effect-roty-val">0°</span>
            </div>
            <input type="range" id="effect-roty" min="-60" max="60" value="0" />
          </div>
          <div class="field">
            <div class="field-label">
              <span>Rotate Z (Roll)</span>
              <span class="field-value" id="effect-rotz-val">0°</span>
            </div>
            <input type="range" id="effect-rotz" min="-45" max="45" value="0" />
          </div>
          <div class="field">
            <div class="field-label">
              <span>Floor Reflection</span>
              <span class="field-value" id="effect-refl-val">0%</span>
            </div>
            <input type="range" id="effect-refl" min="0" max="100" value="0" />
          </div>
        </div>
      </section>

      <!-- Typography Text Overlay Panel -->
      <section class="panel" id="panel-text">
        <div class="panel-head">
          <span>Headline & Captions</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="panel-body">
          <div class="field">
            <label class="field-label">Title</label>
            <input type="text" id="text-title" placeholder="e.g. Your New Dashboard" />
          </div>
          <div class="field">
            <label class="field-label">Subtitle</label>
            <input type="text" id="text-subtitle" placeholder="Optional explanatory subtitle" />
          </div>
          <div class="field">
            <label class="field-label">Font Family</label>
            <select id="text-font">
              <option value="sans">Modern Sans (Plus Jakarta)</option>
              <option value="fraunces">Editorial Serif (Fraunces)</option>
              <option value="bricolage">Contemporary Grotesque</option>
              <option value="caveat">Handwritten (Caveat)</option>
              <option value="mono">Monospace (JetBrains)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Export Settings Panel -->
      <section class="panel" id="panel-export">
        <div class="panel-head">
          <span>Export Settings</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="panel-body">
          <div class="field">
            <label class="field-label">Format</label>
            <div class="segmented" id="export-format-seg">
              <button class="seg-btn active" data-val="png">PNG</button>
              <button class="seg-btn" data-val="jpeg">JPEG</button>
              <button class="seg-btn" data-val="webp">WebP</button>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Resolution Multiplier</label>
            <div class="segmented" id="export-scale-seg">
              <button class="seg-btn" data-val="1">1×</button>
              <button class="seg-btn active" data-val="2">2× (Retina)</button>
              <button class="seg-btn" data-val="3">3×</button>
              <button class="seg-btn" data-val="4">4× (Print)</button>
            </div>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
